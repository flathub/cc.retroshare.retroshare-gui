app-id: cc.retroshare.retroshare-gui
runtime: org.kde.Platform
runtime-version: "5.15-24.08"
sdk: org.kde.Sdk
command: retroshare
finish-args:
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --filesystem=host
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  no-debuginfo: true
  strip: false
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/info
  - "*.a"
  - "*.la"

rename-desktop-file: retroshare.desktop
rename-icon: retroshare

modules:
  # sqlcipher build dep
  - name: tcl
    buildsystem: autotools
    subdir: unix
    sources:
      - type: archive
        url: https://sourceforge.net/projects/tcl/files/Tcl/8.6.16/tcl8.6.16-src.tar.gz
        sha256: 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5
    cleanup:
      - /bin
      - /lib

  # retroshare dep
  - name: sqlcipher
    skip-arches:
      - aarch64
    buildsystem: autotools
    config-opts:
      - --with-tempstore=yes
      - --disable-tcl
#      - --enable-shared
#      - --enable-static
    build-options:
      cflags:
        -DSQLITE_HAS_CODEC
# note 4.9.0 does not create libsqlcipher.a only libsql.a
# cflags required for 4.9
#        -DSQLITE_EXTRA_INIT=sqlcipher_extra_init
#        -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown
#        -SQLITE_THREADSAFE=1
      ldflags: -lcrypto
#    dependencies:
#      - name: tcl
#        type: library
    sources:
      - type: archive
        url: https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.6.1.tar.gz
        sha256: d8f9afcbc2f4b55e316ca4ada4425daf3d0b4aab25f45e11a802ae422b9f53a3
#        url: https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.9.0.tar.gz
#        sha256: 91936630ce58a9979de3136bd5292535ee0c0b2d8e901c483335ac4fb2be4185
    cleanup:
      - /bin

  # retroshare dep
  - name: miniupnpc
    buildsystem: cmake-ninja
    config-opts:
      - -DUPNPC_BUILD_STATIC=FALSE
      - -DUPNPC_BUILD_SHARED=TRUE
      - -DUPNPC_BUILD_TESTS=FALSE
      - -DUPNPC_BUILD_SAMPLE=FALSE
    cleanup:
      - /include
      - /share/doc
    sources:
      - type: archive
        url: http://miniupnp.free.fr/files/miniupnpc-2.2.5.tar.gz
        sha256: 38acd5f4602f7cf8bcdc1ec30b2d58db2e9912e5d9f5350dd99b06bfdffb517c

  # tor dep
  - name: libevent
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
        sha256: 92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb

# retroshare dep
  - name: tor
    buildsystem: autotools
#    dependencies:
#      - name: libevent
#        type: library
    sources:
      - type: archive
        url: https://dist.torproject.org/tor-0.4.8.21.tar.gz
        sha256: eaf6f5b73091b95576945eade98816ddff7cd005befe4d94718a6f766b840903

  # retroshare dep
  - name: rapidjson
    buildsystem: cmake-ninja
    config-opts:
      - -DRAPIDJSON_BUILD_DOC=OFF
      - -DRAPIDJSON_BUILD_EXAMPLES=OFF
      - -DRAPIDJSON_BUILD_TESTS=OFF
    cleanup:
      - /include
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/Tencent/rapidjson/archive/refs/heads/master.zip
        sha256: 45657e20a02417e4d874a7861c7e3fc00cd03f83344bd20f4c894483a7336b4c

  # retroshare dependeny for autologin
  - shared-modules/libsecret/libsecret.json

  # restbed dep (rs_jsonapi), header-only standalone ASIO.
  # Keep < 1.33: restbed still includes asio/io_service.hpp, removed in 1.33.
  - name: asio
    buildsystem: simple
    build-commands:
      - install -d /app/include
      - cp -r asio/include/asio.hpp asio/include/asio /app/include/
    sources:
      - type: git
        url: https://github.com/chriskohlhoff/asio.git
        tag: asio-1-30-2
        commit: 12e0ce9e0500bf0f247dbd1ae894272656456079

  - name: retroshare-gui
    buildsystem: qmake
    config-opts:
      - CONFIG-=debug
      - CONFIG+=release
      - CONFIG+=rs_efs
      - CONFIG+=rs_autologin
      - CONFIG+=rs_jsonapi
      - CONFIG+=rs_webui
      # master defaults to librnp (needs Botan, not in the KDE runtime);
      # keep the bundled OpenPGP-SDK like v0.6.7.x did
      - CONFIG+=rs_no_rnplib
      # build the plugins/ subdir (we limit it to RetroChess below)
      - CONFIG+=retroshare_plugins
      - RS_UPNP_LIB=miniupnpc
    build-options:
      env:
        # restbed's Findasio.cmake only hints /usr/include and /usr/local/include
        CMAKE_INCLUDE_PATH: /app/include
      arch:
        aarch64:
          config-opts:
            - CONFIG-=debug
            - CONFIG+=release
            - CONFIG+=no_sqlcipher
            - CONFIG+=rs_no_rnplib
            - CONFIG+=retroshare_plugins
            - RS_UPNP_LIB=miniupnpc
    sources:
    # RetroChess tracks RetroShare master (rschats.h / rsChats API, added
    # Dec 2025), so it cannot be built against the v0.6.7.3 tag.
    - type: git
      url: https://github.com/RetroShare/RetroShare.git
      commit: 662406b9b39de398dcd13e0c4fda931a9fcb7c45
      disable-shallow-clone: true
    - type: git
      url: https://github.com/RetroShare/RetroChess.git
      commit: f41b3e723d1fb778bc8950c731402bc11cffaac9
      dest: plugins/RetroChess
    # Only build RetroChess (VOIP needs ffmpeg/OpenCV, FeedReader needs
    # extra deps); add them back here if you want them shipped too.
    - type: shell
      commands:
        - printf 'TEMPLATE = subdirs\nSUBDIRS += RetroChess\n' > plugins/plugins.pro
        # The bundled 2016 RapidJSON has a copy-assignment that writes a const
        # member; GCC 14 rejects it. Drop it like upstream RapidJSON did.
        - sed -i '/GenericStringRef& operator=(const GenericStringRef& rhs) { s = rhs.s; length = rhs.length; }/d'
          supportlibs/rapidjson/include/rapidjson/document.h
        - "! grep -q 'GenericStringRef& operator=' supportlibs/rapidjson/include/rapidjson/document.h"
    - type: file
      path: cc.retroshare.retroshare-gui.appdata.xml
    - type: patch
      path: 0001-adapt-desktop-file.patch
    post-install:
      - install -Dm644 cc.retroshare.retroshare-gui.appdata.xml /app/share/appdata/cc.retroshare.retroshare-gui.appdata.xml
      # RetroShare loads plugins from $PREFIX/lib/retroshare/extensions6
      - test -e /app/lib/retroshare/extensions6/libRetroChess.so
